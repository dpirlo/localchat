    function addMessage(role, text = '') {
      document.querySelector('#welcome')?.remove();
      const bubble = document.createElement('div');
      bubble.className = `message ${role}`;
      bubble.textContent = text;
      bubble.dataset.copyText = text;
      messagesBox.append(bubble);
      messagesBox.scrollTop = messagesBox.scrollHeight;
      return bubble;
    }

    function formatWorkDuration(durationMs) {
      const totalSeconds = Math.max(0, Number(durationMs) || 0) / 1000;
      if (totalSeconds < 1) return 'Trabajó durante menos de 1 s';
      if (totalSeconds < 10) return `Trabajó durante ${totalSeconds.toFixed(1).replace('.', ',')} s`;
      if (totalSeconds < 60) return `Trabajó durante ${Math.round(totalSeconds)} s`;
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = Math.round(totalSeconds % 60);
      return `Trabajó durante ${minutes} min${seconds ? ` ${seconds} s` : ''}`;
    }

    function setMessageDuration(bubble, durationMs) {
      if (!bubble || !Number.isFinite(durationMs) || durationMs < 0) return;
      bubble.dataset.duration = formatWorkDuration(durationMs);
    }

    function normalizePerformanceData(value) {
      if (!value || typeof value !== 'object') return null;
      const number = input => Number.isFinite(Number(input)) && Number(input) >= 0 ? Number(input) : 0;
      const normalized = {
        model: String(value.model || '').slice(0, 120),
        processor: String(value.processor || '').slice(0, 40),
        promptTokens: number(value.promptTokens),
        generatedTokens: number(value.generatedTokens),
        tokensPerSecond: number(value.tokensPerSecond),
        modelDurationMs: number(value.modelDurationMs),
        contextLength: number(value.contextLength),
        sizeBytes: number(value.sizeBytes),
        vramBytes: number(value.vramBytes),
        ramBytes: number(value.ramBytes)
      };
      return (Object.values(normalized).some(item => typeof item === 'number' && item > 0)
        || normalized.model || normalized.processor)
        ? normalized
        : null;
    }

    function formatBytes(value) {
      const bytes = Number(value) || 0;
      if (bytes <= 0) return '—';
      const units = ['B', 'KB', 'MB', 'GB'];
      const unitIndex = Math.min(units.length - 1, Math.floor(Math.log(bytes) / Math.log(1024)));
      const amount = bytes / (1024 ** unitIndex);
      return `${amount.toLocaleString('es-AR', { maximumFractionDigits: unitIndex >= 3 ? 1 : 0 })} ${units[unitIndex]}`;
    }

    function setMessagePerformance(bubble, value, durationMs) {
      const performance = normalizePerformanceData(value);
      if (!bubble || !performance) return;
      bubble.removeAttribute('data-duration');
      const details = document.createElement('details');
      details.className = 'performance-panel';
      const summary = document.createElement('summary');
      const speed = performance.tokensPerSecond
        ? ` · ${performance.tokensPerSecond.toLocaleString('es-AR', { maximumFractionDigits: 1 })} tok/s`
        : '';
      const durationLabel = Number.isFinite(Number(durationMs))
        ? formatWorkDuration(Number(durationMs))
        : 'Rendimiento';
      summary.textContent = `${durationLabel}${speed}`;
      const grid = document.createElement('div');
      grid.className = 'performance-grid';
      const memory = performance.vramBytes || performance.ramBytes
        ? `VRAM ${formatBytes(performance.vramBytes)} · RAM ${formatBytes(performance.ramBytes)}`
        : formatBytes(performance.sizeBytes);
      const rows = [
        ['Modelo', performance.model || '—'],
        ['Procesador', performance.processor || '—'],
        ['Tokens de entrada', performance.promptTokens.toLocaleString('es-AR')],
        ['Tokens generados', performance.generatedTokens.toLocaleString('es-AR')],
        ['Velocidad', performance.tokensPerSecond ? `${performance.tokensPerSecond.toLocaleString('es-AR', { maximumFractionDigits: 2 })} tok/s` : '—'],
        ['Tiempo del modelo', performance.modelDurationMs ? formatWorkDuration(performance.modelDurationMs).replace('Trabajó durante ', '') : '—'],
        ['Contexto', performance.contextLength ? `${performance.promptTokens.toLocaleString('es-AR')} / ${performance.contextLength.toLocaleString('es-AR')} tokens` : '—'],
        ['Memoria del modelo', memory]
      ];
      for (const [label, content] of rows) {
        const row = document.createElement('div');
        const labelElement = document.createElement('div');
        labelElement.textContent = label;
        const valueElement = document.createElement('div');
        valueElement.className = 'performance-value';
        valueElement.textContent = content;
        row.append(labelElement, valueElement);
        grid.append(row);
      }
      details.append(summary, grid);
      bubble.insertAdjacentElement('afterend', details);
    }

    function plainTextForCopy(value) {
      return String(value || '')
        .replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '$1 — $2')
        .replace(/^#{1,6}\s+/gm, '')
        .replace(/\*\*([^*]+)\*\*/g, '$1')
        .replace(/__([^_]+)__/g, '$1')
        .replace(/`([^`]+)`/g, '$1')
        .trim();
    }

    function selectedTextInside(range, element) {
      const elementRange = document.createRange();
      elementRange.selectNodeContents(element);
      const intersection = document.createRange();

      if (range.compareBoundaryPoints(Range.START_TO_START, elementRange) <= 0) {
        intersection.setStart(elementRange.startContainer, elementRange.startOffset);
      } else {
        intersection.setStart(range.startContainer, range.startOffset);
      }

      if (range.compareBoundaryPoints(Range.END_TO_END, elementRange) >= 0) {
        intersection.setEnd(elementRange.endContainer, elementRange.endOffset);
      } else {
        intersection.setEnd(range.endContainer, range.endOffset);
      }

      return intersection.toString().trim();
    }

    messagesBox.addEventListener('copy', event => {
      const selection = window.getSelection();
      if (!selection || selection.isCollapsed || !selection.rangeCount) return;
      const range = selection.getRangeAt(0);
      const selectedMessages = [...messagesBox.querySelectorAll('.message.user, .message.assistant')]
        .filter(message => {
          try { return range.intersectsNode(message); }
          catch { return false; }
        });
      if (!selectedMessages.length) return;

      const selectedParts = selectedMessages.map(message => ({
        message,
        text: selectedTextInside(range, message)
      })).filter(part => part.text);
      if (!selectedParts.length) return;

      if (selectedParts.length === 1) {
        const fullVisibleText = selectedParts[0].message.innerText.trim();
        if (selectedParts[0].text !== fullVisibleText) return;
      }

      const copiedConversation = selectedParts.map(({ message, text }) => {
        const author = message.classList.contains('user') ? 'yo' : 'ia';
        const fullVisibleText = message.innerText.trim();
        const copyText = text === fullVisibleText
          ? plainTextForCopy(message.dataset.copyText || message.innerText)
          : text;
        return `${author}: ${copyText}`;
      }).join('\n\n');
      event.clipboardData.setData('text/plain', copiedConversation);
      event.preventDefault();
    });

    function openHistory() {
      historyDrawer.classList.add('open');
      drawerOverlay.classList.add('open');
      renderConversationList();
      requestAnimationFrame(() => historySearchInput.focus({ preventScroll: true }));
    }

    function setHistoryToolsOpen(open) {
      historyTools.classList.toggle('open', open);
      historySettingsButton.setAttribute('aria-expanded', String(open));
    }

    function toggleHistoryTools() {
      setHistoryToolsOpen(!historyTools.classList.contains('open'));
    }

    function closeHistory() {
      setHistoryToolsOpen(false);
      historyDrawer.classList.remove('open');
      drawerOverlay.classList.remove('open');
    }

    let historyWriteQueue = Promise.resolve();

    function openHistoryDatabase() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(HISTORY_DB_NAME, HISTORY_DB_VERSION);
        request.onupgradeneeded = () => {
          if (!request.result.objectStoreNames.contains(HISTORY_STORE_NAME)) {
            request.result.createObjectStore(HISTORY_STORE_NAME);
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error || new Error('No se pudo abrir el historial local.'));
      });
    }

    async function readHistoryState() {
      const database = await openHistoryDatabase();
      try {
        return await new Promise((resolve, reject) => {
          const transaction = database.transaction(HISTORY_STORE_NAME, 'readonly');
          const request = transaction.objectStore(HISTORY_STORE_NAME).get(HISTORY_STATE_KEY);
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error || new Error('No se pudo leer el historial local.'));
        });
      } finally {
        database.close();
      }
    }

    async function persistHistoryState(snapshot) {
      const database = await openHistoryDatabase();
      try {
        await new Promise((resolve, reject) => {
          const transaction = database.transaction(HISTORY_STORE_NAME, 'readwrite');
          transaction.objectStore(HISTORY_STORE_NAME).put(snapshot, HISTORY_STATE_KEY);
          transaction.oncomplete = () => resolve();
          transaction.onerror = () => reject(transaction.error || new Error('No se pudo guardar el historial local.'));
          transaction.onabort = () => reject(transaction.error || new Error('Se canceló el guardado del historial.'));
        });
      } finally {
        database.close();
      }
    }

    function legacyHistoryState() {
      try {
        const stored = JSON.parse(localStorage.getItem(LEGACY_HISTORY_STORAGE_KEY) || '[]');
        return {
          conversations: Array.isArray(stored) ? stored : [],
          activeConversationId: localStorage.getItem(LEGACY_ACTIVE_CHAT_KEY) || null
        };
      } catch {
        return { conversations: [], activeConversationId: null };
      }
    }

    async function loadStoredConversations() {
      try {
        const storedState = await readHistoryState();
        if (storedState && Array.isArray(storedState.conversations)) {
          conversations = storedState.conversations;
          activeConversationId = storedState.activeConversationId || null;
          return;
        }
      } catch (error) {
        console.warn('IndexedDB no estuvo disponible; se usará el historial anterior.', error);
      }

      const legacyState = legacyHistoryState();
      conversations = legacyState.conversations;
      activeConversationId = legacyState.activeConversationId;
      await writeStoredConversations();
    }

    function writeStoredConversations() {
      const snapshot = typeof structuredClone === 'function'
        ? structuredClone({ conversations, activeConversationId })
        : JSON.parse(JSON.stringify({ conversations, activeConversationId }));
      historyWriteQueue = historyWriteQueue
        .catch(() => {})
        .then(() => persistHistoryState(snapshot))
        .catch(error => {
          console.error('No se pudo guardar el historial completo en IndexedDB.', error);
          try {
            localStorage.setItem(LEGACY_HISTORY_STORAGE_KEY, JSON.stringify(snapshot.conversations));
            if (snapshot.activeConversationId) localStorage.setItem(LEGACY_ACTIVE_CHAT_KEY, snapshot.activeConversationId);
            else localStorage.removeItem(LEGACY_ACTIVE_CHAT_KEY);
          } catch (fallbackError) {
            console.error('Tampoco se pudo guardar la copia de respaldo del historial.', fallbackError);
          }
        });
      return historyWriteQueue;
    }

    function historyExportBaseName() {
      const date = new Intl.DateTimeFormat('en-CA', {
        year: 'numeric', month: '2-digit', day: '2-digit'
      }).format(new Date());
      return `ia-local-historial-${date}`;
    }

    function downloadHistoryFile(fileName, content, type) {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement('a');
      anchor.href = url;
      anchor.download = fileName;
      document.body.append(anchor);
      anchor.click();
      anchor.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function showHistoryTransferStatus(message, error = false) {
      historyTransferStatus.textContent = message;
      historyTransferStatus.style.color = error ? '#fda4af' : '#82f7bd';
    }

    function exportHistoryJson() {
      const payload = {
        format: 'ia-local-history',
        version: 1,
        exportedAt: new Date().toISOString(),
        activeConversationId,
        conversations
      };
      downloadHistoryFile(
        `${historyExportBaseName()}.json`,
        JSON.stringify(payload, null, 2),
        'application/json;charset=utf-8'
      );
      showHistoryTransferStatus(`Exportadas ${conversations.length} conversaciones en JSON.`);
    }

    function exportHistoryMarkdown() {
      const lines = [
        '# Historial de IA Local',
        '',
        `Exportado: ${new Date().toLocaleString('es-AR')}`,
        ''
      ];
      for (const conversation of [...conversations].reverse()) {
        lines.push(`## ${String(conversation.title || 'Conversación').replace(/\n+/g, ' ')}`, '');
        lines.push(`_Última actualización: ${conversationDate(conversation)}_`, '');
        for (const message of conversation.messages || []) {
          lines.push(`### ${message.role === 'assistant' ? 'IA' : 'Yo'}`, '', String(message.content || ''), '');
          if (Number.isFinite(message.durationMs)) lines.push(`_${formatWorkDuration(message.durationMs)}_`, '');
          const messagePerformance = normalizePerformanceData(message.performance);
          if (messagePerformance) {
            const performanceSummary = [
              messagePerformance.model && `Modelo: ${messagePerformance.model}`,
              messagePerformance.processor && `Procesador: ${messagePerformance.processor}`,
              messagePerformance.generatedTokens && `Salida: ${messagePerformance.generatedTokens} tokens`,
              messagePerformance.tokensPerSecond && `Velocidad: ${messagePerformance.tokensPerSecond.toLocaleString('es-AR', { maximumFractionDigits: 2 })} tok/s`
            ].filter(Boolean).join(' · ');
            if (performanceSummary) lines.push(`_${performanceSummary}_`, '');
          }
        }
        lines.push('---', '');
      }
      downloadHistoryFile(
        `${historyExportBaseName()}.md`,
        lines.join('\n'),
        'text/markdown;charset=utf-8'
      );
      showHistoryTransferStatus(`Exportadas ${conversations.length} conversaciones en Markdown.`);
    }

    function sanitizeImportedConversation(value, index) {
      if (!value || typeof value !== 'object' || !Array.isArray(value.messages)) return null;
      const messages = value.messages.map(message => {
        if (!message || !['user', 'assistant'].includes(message.role) || typeof message.content !== 'string') return null;
        const messagePerformance = normalizePerformanceData(message.performance);
        return {
          role: message.role,
          content: message.content,
          ...(Number.isFinite(Number(message.durationMs)) && Number(message.durationMs) >= 0
            ? { durationMs: Number(message.durationMs) }
            : {}),
          ...(messagePerformance ? { performance: messagePerformance } : {})
        };
      }).filter(Boolean);
      if (!messages.length) return null;
      const now = Date.now();
      const firstUser = messages.find(message => message.role === 'user');
      const fallbackTitle = String(firstUser?.content || 'Conversación importada').replace(/\s+/g, ' ').trim();
      return {
        id: String(value.id || `import-${now}-${index}-${Math.random().toString(36).slice(2, 8)}`),
        title: String(value.title || fallbackTitle || 'Conversación importada').slice(0, 200),
        createdAt: Number.isFinite(Number(value.createdAt)) ? Number(value.createdAt) : now,
        updatedAt: Number.isFinite(Number(value.updatedAt)) ? Number(value.updatedAt) : now,
        messages
      };
    }

    async function importHistoryFile(file) {
      try {
        const parsed = JSON.parse(await file.text());
        const source = Array.isArray(parsed) ? parsed : parsed?.conversations;
        if (!Array.isArray(source)) throw new Error('El archivo no contiene un historial compatible.');
        const imported = source.map(sanitizeImportedConversation).filter(Boolean);
        if (!imported.length) throw new Error('No encontré conversaciones válidas para importar.');

        const merged = new Map(conversations.map(conversation => [conversation.id, conversation]));
        let added = 0;
        let updated = 0;
        for (const conversation of imported) {
          const existing = merged.get(conversation.id);
          if (!existing) {
            merged.set(conversation.id, conversation);
            added++;
          } else if (conversation.updatedAt > Number(existing.updatedAt || 0)) {
            merged.set(conversation.id, conversation);
            updated++;
          }
        }
        conversations = [...merged.values()].sort((left, right) => Number(right.updatedAt || 0) - Number(left.updatedAt || 0));
        await writeStoredConversations();
        renderConversationList();
        showHistoryTransferStatus(`Importación lista: ${added} nuevas y ${updated} actualizadas.`);
      } catch (error) {
        showHistoryTransferStatus(`No se pudo importar: ${error.message}`, true);
      } finally {
        importHistoryInput.value = '';
      }
    }

    function conversationTitle() {
      const firstUser = history.find(message => message.role === 'user');
      const normalized = String(firstUser?.content || 'Nueva conversación').replace(/\s+/g, ' ').trim();
      return normalized.length > 55 ? `${normalized.slice(0, 52)}…` : normalized;
    }

    function saveCurrentConversation() {
      if (!history.some(message => message.role === 'user')) return;
      if (!activeConversationId) activeConversationId = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
      const savedMessages = history.map(message => {
        const messagePerformance = normalizePerformanceData(message.performance);
        return {
          role: message.role,
          content: String(message.content || ''),
          ...(Number.isFinite(message.durationMs) && message.durationMs >= 0
            ? { durationMs: Math.round(message.durationMs) }
            : {}),
          ...(messagePerformance ? { performance: messagePerformance } : {})
        };
      }).filter(message => ['user', 'assistant'].includes(message.role) && message.content);
      const existing = conversations.find(item => item.id === activeConversationId);
      const conversation = {
        id: activeConversationId,
        title: existing?.title || conversationTitle(),
        createdAt: existing?.createdAt || Date.now(),
        updatedAt: Date.now(),
        messages: savedMessages
      };
      conversations = [conversation, ...conversations.filter(item => item.id !== activeConversationId)];
      writeStoredConversations();
      renderConversationList();
      deleteActiveButton.disabled = false;
    }

    function contextTerms(value) {
      const normalized = String(value || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLocaleLowerCase('es');
      const words = normalized.match(/[a-z0-9]{3,}/g) || [];
      return new Set(words.filter(word => !CONTEXT_STOP_WORDS.has(word)));
    }

    function contextExcerpt(value, limit = MAX_CONTEXT_MESSAGE_CHARS) {
      const content = String(value || '');
      if (content.length <= limit) return content;
      const headLength = Math.floor(limit * .7);
      const tailLength = limit - headLength - 7;
      return `${content.slice(0, headLength)}\n[…]\n${content.slice(-tailLength)}`;
    }

    function messageRelevance(message, queryTerms, index, total) {
      const terms = contextTerms(message.content);
      let sharedTerms = 0;
      for (const term of queryTerms) {
        if (terms.has(term)) sharedTerms++;
      }
      const recency = total > 1 ? index / (total - 1) : 1;
      return sharedTerms * 10 + recency + (message.role === 'user' ? .25 : 0);
    }

    function contextHistory(currentPrompt = '') {
      const eligible = history
        .map((message, historyIndex) => ({
          message,
          historyIndex,
          content: String(message.contextContent || message.content || '')
        }))
        .filter(item => item.content && ['user', 'assistant'].includes(item.message.role));
      if (!eligible.length) return [];

      const queryTerms = contextTerms(currentPrompt || eligible.at(-1).message.content);
      const priority = [];
      const queued = new Set();
      const queue = item => {
        if (!item || queued.has(item.historyIndex)) return;
        queued.add(item.historyIndex);
        priority.push(item);
      };

      for (let index = eligible.length - 1; index >= Math.max(0, eligible.length - RECENT_CONTEXT_MESSAGES); index--) {
        queue(eligible[index]);
      }

      const older = eligible
        .slice(0, Math.max(0, eligible.length - RECENT_CONTEXT_MESSAGES))
        .map((item, index) => ({
          item,
          eligibleIndex: index,
          score: messageRelevance(item.message, queryTerms, index, eligible.length)
        }))
        .sort((left, right) => right.score - left.score);

      for (const candidate of older) {
        if (candidate.score < 1 || priority.length >= MAX_CONTEXT_MESSAGES) break;
        const pairOffset = candidate.item.message.role === 'user' ? 1 : -1;
        queue(eligible[candidate.eligibleIndex]);
        queue(eligible[candidate.eligibleIndex + pairOffset]);
      }

      const selected = [];
      let characterCount = 0;
      for (const item of priority) {
        if (selected.length >= MAX_CONTEXT_MESSAGES || characterCount >= MAX_CONTEXT_CHARS) break;
        const excerpt = contextExcerpt(item.content, Math.min(MAX_CONTEXT_MESSAGE_CHARS, MAX_CONTEXT_CHARS - characterCount));
        if (!excerpt) continue;
        const contextMessage = { role: item.message.role, content: excerpt };
        if (item.historyIndex === history.length - 1 && Array.isArray(item.message.images)) {
          contextMessage.images = item.message.images;
        }
        selected.push({ ...contextMessage, historyIndex: item.historyIndex });
        characterCount += excerpt.length;
      }

      return selected
        .sort((left, right) => left.historyIndex - right.historyIndex)
        .map(({ historyIndex, ...message }) => message);
    }

    function renderActiveConversation() {
      messagesBox.innerHTML = '';
      deleteActiveButton.disabled = !activeConversationId;
      if (!history.length) {
        const welcome = document.createElement('div');
        welcome.id = 'welcome';
        welcome.className = 'welcome';
        welcome.textContent = 'Empezá una conversación.';
        messagesBox.append(welcome);
        return;
      }
      for (const [messageIndex, message] of history.entries()) {
        const bubble = addMessage(message.role, message.content);
        bubble.dataset.historyIndex = String(messageIndex);
        if (message.role === 'assistant') {
          bubble.innerHTML = renderMarkdown(message.content);
          setMessageDuration(bubble, message.durationMs);
          setMessagePerformance(bubble, message.performance, message.durationMs);
        }
      }
      if (pendingHistoryJump && Number.isInteger(pendingHistoryJump.messageIndex)) {
        const target = messagesBox.querySelector(`[data-history-index="${pendingHistoryJump.messageIndex}"]`);
        pendingHistoryJump = null;
        if (target) {
          requestAnimationFrame(() => {
            target.scrollIntoView({ behavior: 'smooth', block: 'center' });
            target.classList.add('search-hit');
            setTimeout(() => target.classList.remove('search-hit'), 2500);
          });
        }
      } else {
        messagesBox.scrollTop = messagesBox.scrollHeight;
      }
    }

    function loadConversation(id, messageIndex = null) {
      const conversation = conversations.find(item => item.id === id);
      if (!conversation || controller) return;
      activeConversationId = conversation.id;
      pendingHistoryJump = Number.isInteger(messageIndex) ? { messageIndex } : null;
      history = conversation.messages.map(message => ({
        role: message.role,
        content: message.content,
        ...(Number.isFinite(message.durationMs) ? { durationMs: message.durationMs } : {}),
        ...(normalizePerformanceData(message.performance) ? { performance: normalizePerformanceData(message.performance) } : {})
      }));
      writeStoredConversations();
      renderActiveConversation();
      renderConversationList();
      closeHistory();
      promptInput.focus();
    }

    function startNewConversation() {
      if (controller) return;
      activeConversationId = null;
      pendingHistoryJump = null;
      history = [];
      writeStoredConversations();
      renderActiveConversation();
      renderConversationList();
      closeHistory();
      promptInput.value = '';
      imageInput.value = '';
      attachedName.textContent = '';
      promptInput.focus();
    }

    function deleteConversation(id) {
      const conversation = conversations.find(item => item.id === id);
      if (!conversation) return;
      if (!confirm(`¿Eliminar la conversación "${conversation.title}"?`)) return;
      conversations = conversations.filter(item => item.id !== id);
      if (activeConversationId === id) {
        activeConversationId = null;
        history = [];
        renderActiveConversation();
      }
      writeStoredConversations();
      renderConversationList();
      deleteActiveButton.disabled = !activeConversationId;
    }

    function normalizeHistorySearch(value) {
      return String(value || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLocaleLowerCase('es')
        .replace(/[^\p{L}\p{N}]+/gu, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function historySearchTerms(value) {
      return normalizeHistorySearch(value).split(' ').filter(Boolean);
    }

    function matchesHistorySearch(value, terms) {
      const normalized = normalizeHistorySearch(value);
      return terms.length > 0 && terms.every(term => normalized.includes(term));
    }

    function historySearchSnippet(value, terms) {
      const compact = String(value || '').replace(/\s+/g, ' ').trim();
      if (!compact) return '';
      const normalized = normalizeHistorySearch(compact);
      const indexes = terms.map(term => normalized.indexOf(term)).filter(index => index >= 0);
      const firstMatch = indexes.length ? Math.min(...indexes) : 0;
      const start = Math.max(0, firstMatch - 48);
      const end = Math.min(compact.length, start + 150);
      return `${start ? '…' : ''}${compact.slice(start, end)}${end < compact.length ? '…' : ''}`;
    }

    function globalHistoryResults(query) {
      const terms = historySearchTerms(query);
      if (!terms.length) return [];
      const results = [];
      for (const conversation of conversations) {
        let foundMessage = false;
        for (const [messageIndex, message] of conversation.messages.entries()) {
          if (!matchesHistorySearch(message.content, terms)) continue;
          foundMessage = true;
          results.push({ conversation, message, messageIndex, snippet: historySearchSnippet(message.content, terms) });
        }
        if (!foundMessage && matchesHistorySearch(conversation.title, terms)) {
          results.push({
            conversation,
            message: conversation.messages[0] || { role: 'user', content: conversation.title },
            messageIndex: conversation.messages.length ? 0 : null,
            snippet: conversation.title
          });
        }
      }
      return results;
    }

    function conversationDate(conversation) {
      return new Date(conversation.updatedAt).toLocaleString('es-AR', {
        day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'
      });
    }

    function renderConversationList() {
      conversationList.innerHTML = '';
      const searchQuery = historySearchInput.value.trim();
      if (searchQuery) {
        const results = globalHistoryResults(searchQuery);
        historySearchStatus.textContent = `${results.length} resultado${results.length === 1 ? '' : 's'}`;
        if (!results.length) {
          const empty = document.createElement('div');
          empty.className = 'conversation-empty';
          empty.textContent = 'No encontré mensajes con esas palabras.';
          conversationList.append(empty);
          return;
        }

        for (const result of results) {
          const item = document.createElement('div');
          item.className = `conversation-item search-result${result.conversation.id === activeConversationId ? ' active' : ''}`;
          item.addEventListener('click', () => loadConversation(result.conversation.id, result.messageIndex));
          const text = document.createElement('div');
          const title = document.createElement('div');
          title.className = 'conversation-title';
          title.textContent = result.conversation.title;
          const snippet = document.createElement('div');
          snippet.className = 'conversation-snippet';
          snippet.textContent = result.snippet;
          const date = document.createElement('div');
          date.className = 'conversation-date';
          const author = result.message.role === 'assistant' ? 'IA' : 'Vos';
          date.textContent = `${author} · ${conversationDate(result.conversation)}`;
          text.append(title, snippet, date);
          item.append(text);
          conversationList.append(item);
        }
        return;
      }

      historySearchStatus.textContent = '';
      if (!conversations.length) {
        const empty = document.createElement('div');
        empty.className = 'conversation-empty';
        empty.textContent = 'Todavía no hay conversaciones guardadas.';
        conversationList.append(empty);
        return;
      }
      for (const conversation of conversations) {
        const item = document.createElement('div');
        item.className = `conversation-item${conversation.id === activeConversationId ? ' active' : ''}`;
        item.addEventListener('click', () => loadConversation(conversation.id));
        const text = document.createElement('div');
        const title = document.createElement('div');
        title.className = 'conversation-title';
        title.textContent = conversation.title;
        const date = document.createElement('div');
        date.className = 'conversation-date';
        date.textContent = conversationDate(conversation);
        text.append(title, date);
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'delete-chat';
        remove.title = 'Eliminar conversación';
        remove.textContent = '🗑';
        remove.addEventListener('click', event => {
          event.stopPropagation();
          deleteConversation(conversation.id);
        });
        item.append(text, remove);
        conversationList.append(item);
      }
    }

    function restoreLastConversation() {
      const conversation = conversations.find(item => item.id === activeConversationId);
      if (conversation) {
        history = conversation.messages.map(message => ({
          role: message.role,
          content: message.content,
          ...(Number.isFinite(message.durationMs) ? { durationMs: message.durationMs } : {}),
          ...(normalizePerformanceData(message.performance) ? { performance: normalizePerformanceData(message.performance) } : {})
        }));
      }
      else activeConversationId = null;
      renderActiveConversation();
      renderConversationList();
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function renderInlineMarkdown(value) {
      const codeParts = [];
      let text = String(value).replace(/`([^`]+)`/g, (_, code) => {
        const marker = `@@INLINE_CODE_${codeParts.length}@@`;
        codeParts.push(`<code>${escapeHtml(code)}</code>`);
        return marker;
      });
      text = escapeHtml(text);
      text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (_, label, url) => {
        try {
          const parsed = new URL(url.replace(/&amp;/g, '&'));
          if (!['http:', 'https:'].includes(parsed.protocol)) return `${label} (${url})`;
          return `<a href="${escapeHtml(parsed.href)}" target="_blank" rel="noopener noreferrer">${label}</a>`;
        } catch { return `${label} (${url})`; }
      });
      text = text
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/__([^_]+)__/g, '<strong>$1</strong>')
        .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
      codeParts.forEach((code, index) => {
        text = text.replace(`@@INLINE_CODE_${index}@@`, code);
      });
      return text;
    }

    function renderMarkdown(markdown) {
      const lines = String(markdown).replace(/\r\n?/g, '\n').split('\n');
      const html = [];
      let listType = '';
      let inCode = false;
      let codeLines = [];

      const closeList = () => {
        if (listType) html.push(`</${listType}>`);
        listType = '';
      };

      for (const line of lines) {
        if (/^```/.test(line.trim())) {
          if (inCode) {
            html.push(`<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`);
            codeLines = [];
            inCode = false;
          } else {
            closeList();
            inCode = true;
          }
          continue;
        }
        if (inCode) { codeLines.push(line); continue; }
        if (!line.trim()) { closeList(); continue; }

        const heading = line.match(/^(#{1,3})\s+(.+)$/);
        if (heading) {
          closeList();
          const level = heading[1].length;
          html.push(`<h${level}>${renderInlineMarkdown(heading[2])}</h${level}>`);
          continue;
        }

        const ordered = line.match(/^\s*\d+[.)]\s+(.+)$/);
        const unordered = line.match(/^\s*[-+•]\s+(.+)$/);
        if (ordered || unordered) {
          const desired = ordered ? 'ol' : 'ul';
          if (listType !== desired) { closeList(); html.push(`<${desired}>`); listType = desired; }
          html.push(`<li>${renderInlineMarkdown((ordered || unordered)[1])}</li>`);
          continue;
        }

        closeList();
        if (/^>\s?/.test(line)) html.push(`<blockquote>${renderInlineMarkdown(line.replace(/^>\s?/, ''))}</blockquote>`);
        else html.push(`<p>${renderInlineMarkdown(line)}</p>`);
      }
      if (inCode) html.push(`<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`);
      closeList();
      return html.join('');
    }

    function updateWebState() {
      const option = useWebInput.closest('.web-option');
      option.classList.toggle('active', useWebInput.checked);
      webLabel.textContent = useWebInput.checked
        ? 'Internet activado · esta consulta se envía a DuckDuckGo'
        : 'Internet apagado';
    }

    function updateModelHint() {
      const model = modelInput.value.trim().toLowerCase();
      modelHint.className = 'model-hint';
      if (model.startsWith('qwen3:8b')) {
        modelHint.textContent = '💬 Texto + Internet · recomendado';
        modelHint.classList.add('recommended');
      } else if (model.startsWith('qwen2.5vl:3b')) {
        modelHint.textContent = '👁️ Visual · usalo para analizar imágenes';
        modelHint.classList.add('visual');
      } else {
        modelHint.textContent = 'Modelo local';
      }
    }

    function fileAsBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result).split(',')[1] || '');
        reader.onerror = () => reject(new Error('No se pudo leer el archivo.'));
        reader.readAsDataURL(file);
      });
    }

    function extractFirstPublicUrl(text) {
      const match = String(text || '').match(/https?:\/\/[^\s<>"']+/i);
      return match ? match[0].replace(/[),.;!?]+$/, '') : '';
    }

    function isReverseImageSearch(prompt, imageFile, imageUrl) {
      if (!imageFile && !imageUrl) return false;
      const text = String(prompt || '').toLocaleLowerCase('es');
      const explicit = /\b(b[uú]squeda inversa|buscar por imagen|reverse image)\b/i.test(text);
      const searchVerb = /\b(busca|buscá|buscar|buscame|búscame|buscala|buscála|buscalo|buscálo|rastrear|rastreá|encontrar|encontrá)\b/i.test(text);
      return explicit || searchVerb;
    }

    function openReverseSearchTabs() {
      return REVERSE_SEARCH_ENGINE_NAMES.map(name => {
        const tab = window.open('about:blank', '_blank');
        if (!tab) return null;
        try {
          tab.document.title = `Preparando ${name}…`;
          tab.document.body.style.cssText = 'margin:0;display:grid;place-items:center;min-height:100vh;background:#111318;color:#e6e7eb;font:16px system-ui';
          tab.document.body.textContent = `Preparando búsqueda en ${name}…`;
        } catch {}
        return tab;
      });
    }

    function closePendingSearchTabs(tabs) {
      for (const tab of tabs) {
        try { if (tab && !tab.closed) tab.close(); }
        catch {}
      }
    }

    function addImagePreview(bubble, file) {
      if (!bubble || !file) return;
      const previewUrl = URL.createObjectURL(file);
      const image = document.createElement('img');
      image.className = 'message-image-preview';
      image.alt = file.name || 'Imagen adjunta';
      image.src = previewUrl;
      image.addEventListener('load', () => URL.revokeObjectURL(previewUrl), { once: true });
      image.addEventListener('error', () => URL.revokeObjectURL(previewUrl), { once: true });
      bubble.append(image);
    }

    async function loadModels() {
      errorBox.style.display = 'none';
      setStatus('Conectando con Ollama…');

      try {
        const response = await fetch(usingNodeBridge ? '/api/models' : `${baseUrl()}/api/tags`);
        if (!response.ok) throw new Error(`Ollama respondió ${response.status}`);

        const data = await response.json();
        const models = data.models || [];
        const previousModel = modelInput.value;
        modelInput.innerHTML = '';

        if (!models.length) {
          showError('Ollama está activo, pero no encontré modelos descargados.');
          return;
        }

        for (const item of models) {
          const option = document.createElement('option');
          option.value = item.name;
          if (item.name.startsWith('qwen3:8b')) {
            option.textContent = `${item.name} — Texto + Internet (recomendado)`;
          } else if (item.name.startsWith('qwen2.5vl:3b')) {
            option.textContent = `${item.name} — Visual (imágenes)`;
          } else {
            option.textContent = item.name;
          }
          modelInput.append(option);
        }

        const preferredModel = models.find(item => item.name.startsWith('qwen3:8b'));
        const previousStillExists = models.some(item => item.name === previousModel);
        modelInput.value = previousStillExists ? previousModel : (preferredModel?.name || models[0].name);
        updateModelHint();

        setStatus('Ollama conectado', 'ok');
      } catch (error) {
        showError('No pude conectar con Ollama. Confirmá que esté abierto en localhost:11434. Si abriste este HTML como archivo y aparece un error de CORS, iniciá Ollama permitiendo este origen.');
      }
    }

    function runtimeFromOllamaPayload(payload, model) {
      const models = Array.isArray(payload?.models) ? payload.models : [];
      const requested = String(model || '').toLocaleLowerCase();
      const loaded = models.find(item => String(item.name || item.model || '').toLocaleLowerCase() === requested) || models[0];
      if (!loaded) return { loaded: false };
      const sizeBytes = Math.max(0, Number(loaded.size || 0));
      const vramBytes = Math.max(0, Number(loaded.size_vram || 0));
      return {
        loaded: true,
        model: loaded.name || loaded.model || model,
        processor: vramBytes <= 0 ? 'CPU' : (sizeBytes > 0 && vramBytes >= sizeBytes * .95 ? 'GPU' : 'CPU + GPU'),
        sizeBytes,
        vramBytes,
        ramBytes: Math.max(0, sizeBytes - vramBytes),
        contextLength: Number(loaded.context_length || 0)
      };
    }

    async function loadRuntimeInfo(model) {
      try {
        const runtimeUrl = usingNodeBridge
          ? `/api/runtime?model=${encodeURIComponent(model)}&ollamaUrl=${encodeURIComponent(baseUrl())}`
          : `${baseUrl()}/api/ps`;
        const response = await fetch(runtimeUrl, { cache: 'no-store' });
        if (!response.ok) return null;
        const payload = await response.json();
        return usingNodeBridge ? payload : runtimeFromOllamaPayload(payload, model);
      } catch {
        return null;
      }
    }

    function performanceFromResponse(chunk, runtime, model) {
      if (!chunk && !runtime?.loaded) return null;
      const generatedTokens = Math.max(0, Number(chunk?.eval_count || 0));
      const evaluationSeconds = Math.max(0, Number(chunk?.eval_duration || 0)) / 1e9;
      return normalizePerformanceData({
        model: runtime?.model || model,
        processor: runtime?.processor || '',
        promptTokens: Number(chunk?.prompt_eval_count || 0),
        generatedTokens,
        tokensPerSecond: evaluationSeconds > 0 ? generatedTokens / evaluationSeconds : 0,
        modelDurationMs: Math.max(0, Number(chunk?.total_duration || 0)) / 1e6,
        contextLength: runtime?.contextLength || 8192,
        sizeBytes: runtime?.sizeBytes || 0,
        vramBytes: runtime?.vramBytes || 0,
        ramBytes: runtime?.ramBytes || 0
      });
    }

    async function sendPrompt() {
      const attachedFile = imageInput.files?.[0] || null;
      const isPdf = Boolean(attachedFile && (attachedFile.type === 'application/pdf' || /\.pdf$/i.test(attachedFile.name)));
      const imageFile = attachedFile && !isPdf ? attachedFile : null;
      const prompt = promptInput.value.trim() || (isPdf ? 'Resumí este PDF.' : (imageFile ? 'Describí esta imagen.' : ''));
      const model = modelInput.value.trim();
      const imageUrl = extractFirstPublicUrl(prompt);
      const reverseImageSearch = !isPdf && isReverseImageSearch(prompt, imageFile, imageUrl);
      if (!prompt || controller || (!model && !reverseImageSearch)) return;

      const reverseSearchTabs = reverseImageSearch ? openReverseSearchTabs() : [];
      let reverseSearchNavigated = false;

      if (attachedFile && !isPdf && !/^image\/(png|jpeg|webp|gif)$/i.test(attachedFile.type)) {
        addMessage('error', 'El archivo no es compatible. Adjuntá un PDF, JPG, PNG, WebP o GIF.');
        return;
      }

      if (imageFile && !reverseImageSearch && !model.toLowerCase().startsWith('qwen2.5vl:3b')) {
        addMessage('error', 'Para adjuntar imágenes seleccioná qwen2.5vl:3b, marcado como Visual.');
        return;
      }

      const needsCurrentInfo = /\b(busca|buscá|buscame|búscame|internet|hoy|ahora|actual|actuales|temperatura|clima|noticias|eventos|actividades)\b/i.test(prompt);
      if (!reverseImageSearch && !isPdf && needsCurrentInfo && !useWebInput.checked) {
        errorBox.style.display = 'none';
        addMessage('error', 'Esta consulta necesita información actual. Activá “Internet” arriba y volvé a enviarla.');
        return;
      }

      const workStartedAt = performance.now();
      void requestNotificationPermission();
      let attachmentBase64 = '';
      if (attachedFile) {
        try {
          attachmentBase64 = await fileAsBase64(attachedFile);
        } catch (error) {
          closePendingSearchTabs(reverseSearchTabs);
          addMessage('error', error.message);
          return;
        }
      }

      controller = new AbortController();
      setThinkingState(true);
      sendButton.disabled = true;
      sendButton.textContent = reverseImageSearch ? 'Buscando…' : (isPdf ? 'Leyendo…' : 'Pensando…');
      errorBox.style.display = 'none';
      setStatus(reverseImageSearch ? 'Preparando búsqueda inversa…' : (isPdf ? 'Leyendo PDF…' : 'Generando…'), 'ok');
      const userBubble = addMessage('user', attachedFile ? `${prompt}\n${isPdf ? '📄' : '📎'} ${attachedFile.name}` : prompt);
      addImagePreview(userBubble, imageFile);
      promptInput.value = '';
      const assistantBubble = addMessage('assistant');
      let assistantText = '';
      const userMessage = { role: 'user', content: prompt };
      if (attachmentBase64 && imageFile && !reverseImageSearch) userMessage.images = [attachmentBase64];
      history.push(userMessage);
      saveCurrentConversation();
      imageInput.value = '';
      attachedName.textContent = '';

      try {
        if (reverseImageSearch) {
          if (!usingNodeBridge) {
            throw new Error('La búsqueda inversa necesita que abras la app con iniciar-chat.bat o IA-Local.exe.');
          }
          const response = await fetch('/api/reverse-image-search', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              imageUrl: imageFile ? '' : imageUrl,
              imageBase64: imageFile ? attachmentBase64 : '',
              imageType: imageFile?.type || '',
              imageName: imageFile?.name || ''
            }),
            signal: controller.signal
          });
          const result = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(result.error || `El servidor respondió ${response.status}`);

          let openedCount = 0;
          result.engines.forEach((engine, index) => {
            const tab = reverseSearchTabs[index];
            if (!tab || tab.closed) return;
            try {
              tab.location.replace(engine.url);
              openedCount++;
            } catch {}
          });
          reverseSearchNavigated = openedCount > 0;
          const blockedCount = Math.max(0, result.engines.length - openedCount);
          const lines = [
            `Abrí ${openedCount} de ${result.engines.length} buscadores de imagen.`,
            '',
            ...result.engines.map(engine => `- [${engine.name}](${engine.url})`)
          ];
          if (result.temporary) {
            lines.push('', 'La imagen adjunta se alojó temporalmente durante 1 hora para que los buscadores puedan verla.');
          }
          if (blockedCount) {
            lines.push('', `El navegador bloqueó ${blockedCount} pestaña${blockedCount === 1 ? '' : 's'}. Habilitá las ventanas emergentes para http://127.0.0.1 y, mientras tanto, usá los enlaces de arriba.`);
          }
          assistantText = lines.join('\n');
          assistantBubble.dataset.copyText = assistantText;
          assistantBubble.innerHTML = renderMarkdown(assistantText);
          const durationMs = Math.round(performance.now() - workStartedAt);
          setMessageDuration(assistantBubble, durationMs);
          history.push({ role: 'assistant', content: assistantText, durationMs });
          saveCurrentConversation();
          setStatus('Ollama conectado', 'ok');
          void notifyAnswerReady();
          return;
        }

        if (isPdf) {
          if (!usingNodeBridge) {
            throw new Error('Para leer PDFs, abrí la app con iniciar-chat.bat o IA-Local.exe.');
          }
          const pdfResponse = await fetch('/api/pdf-text', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              pdfBase64: attachmentBase64,
              fileName: attachedFile.name
            }),
            signal: controller.signal
          });
          const pdfResult = await pdfResponse.json().catch(() => ({}));
          if (!pdfResponse.ok) throw new Error(pdfResult.error || `No se pudo leer el PDF (${pdfResponse.status}).`);
          const documentNote = pdfResult.truncated
            ? 'El texto fue recortado para ajustarlo al contexto disponible.'
            : 'Se extrajo el texto completo disponible.';
          userMessage.contextContent = `${prompt}\n\n[PDF ADJUNTO: ${attachedFile.name}. ${documentNote}]\n\n${pdfResult.text}`;
          setStatus('Generando respuesta…', 'ok');
        }

        const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
        const currentDate = new Intl.DateTimeFormat('es-AR', {
          dateStyle: 'full',
          timeStyle: 'short',
          timeZone
        }).format(new Date());
        const systemMessage = {
          role: 'system',
          content: `Respondé en español salvo que el usuario pida otro idioma. La fecha y hora actuales son ${currentDate} (${timeZone}). Mantené un estilo directo, natural y útil. Evitá introducciones defensivas y advertencias genéricas no solicitadas. Si una petición concreta no puede responderse, indicá el límite brevemente y ofrecé inmediatamente la alternativa más cercana que sí puedas resolver. Los mensajes anteriores pertenecen a la misma conversación: interpretá las repreguntas usando ese contexto y no las trates como consultas aisladas. Si el usuario pide repetir fuentes o enlaces de una respuesta anterior, copiá exactamente las URLs ya presentes en el historial; no inventes ni reemplaces enlaces. No inventes hechos ni supongas datos actuales. Si recibís resultados web, usalos como fuente factual y no digas que carecés de acceso a Internet.`
        };

        if (useWebInput.checked && !usingNodeBridge) {
          throw new Error('Para usar Internet, abrí iniciar-chat.bat en vez del HTML directamente.');
        }

        if (useWebInput.checked && !isPdf) setStatus('Buscando en Internet…', 'ok');

        const response = await fetch(usingNodeBridge ? '/api/chat' : `${baseUrl()}/api/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model,
            messages: [systemMessage, ...contextHistory(prompt)],
            stream: true,
            useWeb: useWebInput.checked && !isPdf,
            ollamaUrl: baseUrl()
          }),
          signal: controller.signal
        });

        if (!response.ok) {
          let details = '';
          const errorResponse = response.clone();
          try {
            const errorData = await response.json();
            details = errorData.error || '';
          } catch {
            details = await errorResponse.text();
          }
          throw new Error(details || `El servidor respondió ${response.status}`);
        }

        if (!response.body) throw new Error('El navegador no entregó el stream de respuesta.');

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let pending = '';
        let finalOllamaChunk = null;

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          pending += decoder.decode(value, { stream: true });
          const lines = pending.split('\n');
          pending = lines.pop() || '';

          for (const line of lines) {
            if (!line.trim()) continue;
            const chunk = JSON.parse(line);
            if (chunk.error) throw new Error(chunk.error);
            if (chunk.done) finalOllamaChunk = chunk;
            assistantText += chunk.message?.content || '';
            assistantBubble.textContent = assistantText;
            assistantBubble.dataset.copyText = assistantText;
            messagesBox.scrollTop = messagesBox.scrollHeight;
          }
        }

        if (pending.trim()) {
          const chunk = JSON.parse(pending);
          if (chunk.error) throw new Error(chunk.error);
          if (chunk.done) finalOllamaChunk = chunk;
          assistantText += chunk.message?.content || '';
        }

        assistantBubble.dataset.copyText = assistantText;
        assistantBubble.innerHTML = renderMarkdown(assistantText);
        const durationMs = Math.round(performance.now() - workStartedAt);
        const runtime = await loadRuntimeInfo(model);
        const responsePerformance = performanceFromResponse(finalOllamaChunk, runtime, model);
        setMessageDuration(assistantBubble, durationMs);
        setMessagePerformance(assistantBubble, responsePerformance, durationMs);
        history.push({
          role: 'assistant',
          content: assistantText,
          durationMs,
          ...(responsePerformance ? { performance: responsePerformance } : {})
        });
        saveCurrentConversation();
        setStatus('Ollama conectado', 'ok');
        if (assistantText.trim()) void notifyAnswerReady();
      } catch (error) {
        if (reverseImageSearch && !reverseSearchNavigated) closePendingSearchTabs(reverseSearchTabs);
        if (error.name !== 'AbortError') {
          showError(`No se pudo generar la respuesta: ${error.message}`);
          if (!assistantText) assistantBubble.remove();
          addMessage('error', `No se pudo generar la respuesta: ${error.message}`);
        }
      } finally {
        setThinkingState(false);
        controller = null;
        sendButton.disabled = false;
        sendButton.textContent = 'Enviar';
        promptInput.focus();
      }
    }

    sendButton.addEventListener('click', sendPrompt);
    promptInput.addEventListener('keydown', event => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendPrompt();
      }
    });
    baseUrlInput.addEventListener('change', loadModels);
    useWebInput.addEventListener('change', updateWebState);
    modelInput.addEventListener('change', updateModelHint);
    imageInput.addEventListener('change', () => {
      attachedName.textContent = imageInput.files?.[0]?.name || '';
    });
    menuButton.addEventListener('click', openHistory);
    closeDrawerButton.addEventListener('click', closeHistory);
    drawerOverlay.addEventListener('click', closeHistory);
    newChatButton.addEventListener('click', startNewConversation);
    historySearchInput.addEventListener('input', renderConversationList);
    historySettingsButton.addEventListener('click', event => {
      event.stopPropagation();
      toggleHistoryTools();
    });
    historyTools.addEventListener('click', event => event.stopPropagation());
    document.addEventListener('click', () => setHistoryToolsOpen(false));
    exportHistoryJsonButton.addEventListener('click', () => {
      exportHistoryJson();
      setHistoryToolsOpen(false);
    });
    exportHistoryMarkdownButton.addEventListener('click', () => {
      exportHistoryMarkdown();
      setHistoryToolsOpen(false);
    });
    importHistoryButton.addEventListener('click', () => {
      setHistoryToolsOpen(false);
      importHistoryInput.click();
    });
    importHistoryInput.addEventListener('change', () => {
      const file = importHistoryInput.files?.[0];
      if (file) void importHistoryFile(file);
    });
    deleteActiveButton.addEventListener('click', () => {
      if (activeConversationId) deleteConversation(activeConversationId);
    });
    addEventListener('keydown', event => {
      if (event.key !== 'Escape') return;
      if (historyTools.classList.contains('open')) setHistoryToolsOpen(false);
      else closeHistory();
    });

    async function initializeApp() {
      await loadStoredConversations();
      restoreLastConversation();
      updateWebState();
      updateModelHint();
      if (usingNodeBridge) {
        const sendHeartbeat = () => fetch('/api/heartbeat', {
          method: 'POST',
          cache: 'no-store'
        }).catch(() => {});
        sendHeartbeat();
        setInterval(sendHeartbeat, 5000);
        addEventListener('pagehide', () => {
          navigator.sendBeacon('/api/disconnect');
        });
      }
      loadModels();
    }

    void initializeApp();
  </script>
</body>
</html>
