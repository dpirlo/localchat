<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#14161b" />
  <link id="appFavicon" rel="icon" type="image/svg+xml" href="ai-icon.svg" />
  <title>Mini chat local · Ollama</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b0c0f;
      color: #f5f5f5;
    }

    * { box-sizing: border-box; }

    body {
      height: 100vh;
      height: 100dvh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 12px;
      background:
        radial-gradient(circle at top left, rgba(83, 66, 177, .22), transparent 36%),
        #0b0c0f;
    }

    main {
      width: min(1080px, 100%);
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      border: 1px solid #2a2d35;
      border-radius: 18px;
      overflow: hidden;
      background: rgba(20, 22, 27, .94);
      box-shadow: 0 20px 70px rgba(0, 0, 0, .35);
    }

    .app-header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 20px;
      border-bottom: 1px solid #2a2d35;
    }

    h1 { margin: 0; display: flex; align-items: center; gap: 10px; font-size: 1rem; font-weight: 650; }
    .app-icon-wrap { position: relative; width: 31px; height: 31px; display: grid; flex: 0 0 auto; place-items: center; }
    .app-icon { width: 27px; height: 27px; border-radius: 8px; transition: opacity .18s ease, transform .18s ease; }
    .app-icon-spinner {
      position: absolute;
      inset: 0;
      border: 2px solid rgba(124, 110, 230, .22);
      border-top-color: #8b7df0;
      border-right-color: #67e8f9;
      border-radius: 50%;
      opacity: 0;
      pointer-events: none;
    }
    .app-icon-wrap.thinking .app-icon { opacity: .62; transform: scale(.72); }
    .app-icon-wrap.thinking .app-icon-spinner { opacity: 1; animation: icon-spin .75s linear infinite; }
    @keyframes icon-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .app-icon-wrap.thinking .app-icon-spinner { animation: none; }
    }
    .header-left { display: flex; align-items: center; gap: 10px; }

    .menu-button, .drawer-close, .delete-chat {
      display: grid;
      place-items: center;
      min-width: 0;
      padding: 0;
      border: 1px solid #343842;
      background: #191c22;
      color: #d9dbe2;
      cursor: pointer;
    }

    .menu-button { width: 36px; height: 36px; border-radius: 10px; font-size: 1.1rem; }
    .menu-button:hover, .drawer-close:hover, .delete-chat:hover { background: #242832; }
    .header-actions { display: flex; align-items: center; gap: 12px; }
    .delete-active {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      min-width: 0;
      padding: 0;
      border: 1px solid #49343a;
      border-radius: 9px;
      background: #21181b;
      color: #fda4af;
      cursor: pointer;
    }
    .delete-active:hover:not(:disabled) { background: #362126; border-color: #7f3d49; }
    .delete-active:disabled { cursor: default; opacity: .35; }

    .drawer-overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      visibility: hidden;
      background: rgba(0, 0, 0, .55);
      opacity: 0;
      transition: opacity .18s ease, visibility .18s ease;
    }

    .drawer-overlay.open { visibility: visible; opacity: 1; }

    .history-drawer {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 21;
      width: min(340px, 88vw);
      display: flex;
      flex-direction: column;
      padding: 16px;
      border-right: 1px solid #30343d;
      background: #111318;
      box-shadow: 18px 0 60px rgba(0, 0, 0, .45);
      transform: translateX(-105%);
      transition: transform .2s ease;
    }

    .history-drawer.open { transform: translateX(0); }
    .drawer-header { position: relative; display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .drawer-title { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .drawer-header h2 { margin: 0; font-size: 1rem; }
    .drawer-close { width: 32px; height: 32px; border-radius: 9px; }

    .history-settings-button {
      width: 32px;
      height: 32px;
      padding: 0;
      border-radius: 9px;
      color: #fff;
      font-size: 1rem;
      line-height: 1;
    }

    .history-settings-button[aria-expanded="true"] {
      border-color: #6559bd;
      background: #282342;
      color: #fff;
    }

    .new-chat-button {
      width: 100%;
      min-height: 40px;
      margin-bottom: 10px;
      border: 1px solid #51479b;
      border-radius: 10px;
      background: #302a60;
      cursor: pointer;
      font-weight: 650;
    }

    .history-search {
      position: relative;
      display: block;
      margin-bottom: 6px;
    }

    .history-search span {
      position: absolute;
      top: 50%;
      left: 11px;
      z-index: 1;
      color: #777c88;
      font-size: .9rem;
      transform: translateY(-50%);
      pointer-events: none;
    }

    .history-search input {
      width: 100%;
      height: 38px;
      padding: 0 11px 0 34px;
      border-radius: 10px;
      background: #191c22;
      font-size: .8rem;
    }

    .history-search-status {
      min-height: 18px;
      margin: 0 3px 5px;
      color: #777c88;
      font-size: .68rem;
    }

    .history-tools {
      position: absolute;
      top: 38px;
      left: 0;
      z-index: 2;
      width: 178px;
      display: none;
      grid-template-columns: 1fr;
      gap: 6px;
      padding: 7px;
      border: 1px solid #343844;
      border-radius: 10px;
      background: #191c22;
      box-shadow: 0 12px 30px rgba(0, 0, 0, .45);
    }

    .history-tools.open { display: grid; }

    .history-tools button {
      width: 100%;
      height: 34px;
      padding: 0 10px;
      border-radius: 8px;
      color: #c7c9d1;
      font-size: .75rem;
      text-align: left;
    }

    .history-transfer-status {
      min-height: 17px;
      margin: 0 3px 5px;
      color: #82f7bd;
      font-size: .68rem;
    }

    .conversation-list { min-height: 0; overflow: auto; display: grid; align-content: start; gap: 7px; }
    .conversation-empty { padding: 18px 10px; color: #777c88; text-align: center; font-size: .82rem; }

    .conversation-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 30px;
      gap: 8px;
      align-items: center;
      padding: 9px 8px 9px 11px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: #191c22;
      cursor: pointer;
    }

    .conversation-item:hover { border-color: #343842; }
    .conversation-item.active { border-color: #7567df; background: #211e3a; }
    .conversation-item.search-result { grid-template-columns: minmax(0, 1fr); align-items: start; }
    .conversation-title { overflow: hidden; color: #e5e6eb; text-overflow: ellipsis; white-space: nowrap; font-size: .84rem; }
    .conversation-snippet {
      display: -webkit-box;
      overflow: hidden;
      margin-top: 4px;
      color: #a8abb5;
      font-size: .73rem;
      line-height: 1.35;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }
    .conversation-date { margin-top: 3px; color: #777c88; font-size: .68rem; }
    .delete-chat { width: 28px; height: 28px; border-radius: 8px; color: #a8abb5; }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #a8abb5;
      font-size: .82rem;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #777;
      box-shadow: 0 0 0 4px rgba(119, 119, 119, .12);
    }

    .dot.ok { background: #4ade80; box-shadow: 0 0 0 4px rgba(74, 222, 128, .12); }
    .dot.error { background: #fb7185; box-shadow: 0 0 0 4px rgba(251, 113, 133, .12); }

    .settings {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 12px 20px;
      border-bottom: 1px solid #2a2d35;
      background: #111318;
    }

    label { display: grid; align-content: start; gap: 7px; color: #a8abb5; font-size: .76rem; }

    .web-option {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 9px;
      width: fit-content;
      cursor: pointer;
      color: #c8cad1;
      font-size: .82rem;
    }

    .web-option input { width: 16px; height: 16px; accent-color: #7567df; }
    .web-option.active { color: #86efac; }
    .model-hint { min-height: 1em; color: #8f94a1; font-size: .72rem; }
    .model-hint.recommended { color: #86efac; }
    .model-hint.visual { color: #93c5fd; }

    input, select, textarea, button {
      font: inherit;
      color: inherit;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid #343842;
      border-radius: 10px;
      outline: none;
      background: #191c22;
    }

    input, select { height: 40px; padding: 0 11px; }
    textarea { height: 94px; min-height: 70px; max-height: 130px; padding: 13px; resize: vertical; line-height: 1.5; }
    input:focus, select:focus, textarea:focus { border-color: #7c6ee6; }

    .chat {
      min-height: 0;
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 14px 20px;
    }

    .messages {
      min-height: 120px;
      max-height: none;
      flex: 1 1 auto;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 16px;
      border: 1px solid #2f333c;
      border-radius: 12px;
      background: #0f1115;
    }

    .welcome { margin: auto; color: #777c88; font-size: .9rem; }

    .message {
      width: fit-content;
      max-width: 84%;
      padding: 11px 14px;
      border-radius: 14px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .message.user {
      align-self: flex-end;
      border-bottom-right-radius: 4px;
      background: #7567df;
      color: white;
    }

    .message.assistant {
      position: relative;
      align-self: flex-start;
      border: 1px solid #30343d;
      border-bottom-left-radius: 4px;
      background: #1a1d23;
      color: #e6e7eb;
    }

    .message.assistant[data-duration] { margin-bottom: 16px; }

    .message.assistant[data-duration]::after {
      content: attr(data-duration);
      position: absolute;
      top: calc(100% + 4px);
      left: 4px;
      color: #777c88;
      font-size: .68rem;
      font-weight: 500;
      line-height: 1;
      white-space: nowrap;
    }

    .message.search-hit { animation: history-search-hit 2.4s ease-out; }

    .performance-panel {
      align-self: flex-start;
      max-width: min(84%, 560px);
      margin-top: -8px;
      color: #777c88;
      font-size: .68rem;
    }

    .performance-panel summary {
      width: fit-content;
      cursor: pointer;
      user-select: none;
    }

    .performance-panel[open] summary { color: #a8abb5; }

    .performance-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(120px, 1fr));
      gap: 5px 14px;
      margin-top: 7px;
      padding: 9px 11px;
      border: 1px solid #2f333c;
      border-radius: 9px;
      background: #15181d;
    }

    .performance-value { color: #c7c9d1; }

    @keyframes history-search-hit {
      0%, 22% { outline: 3px solid #a99cff; box-shadow: 0 0 0 7px rgba(124, 110, 230, .18); }
      100% { outline: 0 solid transparent; box-shadow: none; }
    }

    .message.error {
      align-self: center;
      max-width: 100%;
      background: rgba(251, 113, 133, .08);
      color: #fda4af;
      font-size: .84rem;
    }

    .message-image-preview {
      display: block;
      width: min(320px, 100%);
      max-height: 240px;
      margin-top: 9px;
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 10px;
      object-fit: contain;
      background: rgba(0, 0, 0, .2);
    }

    .message.assistant p { margin: 0 0 .8em; }
    .message.assistant p:last-child { margin-bottom: 0; }
    .message.assistant ul, .message.assistant ol { margin: .45em 0 .8em; padding-left: 1.45em; }
    .message.assistant li { margin: .25em 0; }
    .message.assistant h1, .message.assistant h2, .message.assistant h3 {
      display: block;
      margin: .8em 0 .4em;
      font-size: 1.05em;
      color: #fff;
    }
    .message.assistant h1:first-child, .message.assistant h2:first-child, .message.assistant h3:first-child { margin-top: 0; }
    .message.assistant a { color: #a99ff3; text-decoration: underline; text-underline-offset: 2px; }
    .message.assistant code {
      padding: .12em .35em;
      border-radius: 5px;
      background: #0d0f13;
      color: #f0b8ff;
      font-family: Consolas, "Cascadia Code", monospace;
      font-size: .9em;
    }
    .message.assistant pre {
      overflow: auto;
      margin: .65em 0;
      padding: 12px;
      border: 1px solid #30343d;
      border-radius: 9px;
      background: #0d0f13;
    }
    .message.assistant pre code { padding: 0; background: transparent; color: #e6e7eb; }
    .message.assistant blockquote {
      margin: .55em 0;
      padding-left: .8em;
      border-left: 3px solid #7567df;
      color: #b9bbc4;
    }

    .actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .hint { color: #777c88; font-size: .78rem; }

    .attachment {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 34px;
    }

    #imageInput { display: none; }

    .attach-label {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      height: 34px;
      padding: 0 12px;
      border: 1px solid #343842;
      border-radius: 9px;
      background: #191c22;
      color: #c8cad1;
      cursor: pointer;
      font-size: .78rem;
    }

    .attach-label:hover { border-color: #7c6ee6; }
    .attached-name { color: #93c5fd; font-size: .78rem; overflow-wrap: anywhere; }

    button {
      min-width: 112px;
      height: 42px;
      border: 0;
      border-radius: 10px;
      padding: 0 18px;
      cursor: pointer;
      background: #7567df;
      font-weight: 650;
    }

    button:hover { background: #8477e8; }
    button:disabled { cursor: wait; opacity: .65; }

    .error-box {
      flex: 0 0 auto;
      max-height: 72px;
      overflow: auto;
      display: none;
      margin: 0 20px 12px;
      padding: 12px 14px;
      border: 1px solid rgba(251, 113, 133, .35);
      border-radius: 10px;
      background: rgba(251, 113, 133, .08);
      color: #fda4af;
      font-size: .83rem;
      line-height: 1.45;
    }

    .completion-toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 50;
      max-width: min(340px, calc(100vw - 36px));
      padding: 12px 15px;
      border: 1px solid rgba(74, 222, 128, .4);
      border-radius: 11px;
      background: #16251d;
      color: #bbf7d0;
      box-shadow: 0 14px 40px rgba(0, 0, 0, .42);
      opacity: 0;
      pointer-events: none;
      transform: translateY(12px);
      transition: opacity .18s ease, transform .18s ease;
    }
    .completion-toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 600px) {
      body { padding: 0; }
      main { border: 0; border-radius: 0; }
      .app-header { padding: 12px; }
      .settings { grid-template-columns: 1fr; }
      .settings { gap: 8px; padding: 10px 12px; }
      .chat { padding: 10px 12px; }
      textarea { height: 78px; }
      .actions { align-items: stretch; flex-direction: column; }
      .actions button { width: 100%; }
      .performance-panel { max-width: 100%; }
      .performance-grid { grid-template-columns: 1fr; }
    }

    @media (max-height: 760px) {
      .app-header { padding-top: 10px; padding-bottom: 10px; }
      .settings { padding-top: 8px; padding-bottom: 8px; }
      .chat { gap: 8px; padding-top: 9px; padding-bottom: 9px; }
      textarea { height: 68px; min-height: 58px; }
      .attachment { min-height: 30px; }
      .attach-label { height: 30px; }
      .actions button { height: 38px; }
    }
  </style>
</head>
<body>
  <div id="drawerOverlay" class="drawer-overlay"></div>
  <aside id="historyDrawer" class="history-drawer" aria-label="Historial de conversaciones">
    <div class="drawer-header">
      <div class="drawer-title">
        <button id="historySettingsButton" class="history-settings-button" type="button" aria-label="Opciones del historial" aria-controls="historyTools" aria-expanded="false" title="Opciones del historial">⚙</button>
        <h2>Conversaciones</h2>
      </div>
      <div id="historyTools" class="history-tools" aria-label="Opciones del historial">
        <button id="exportHistoryJson" type="button" title="Copia importable">Exportar JSON</button>
        <button id="exportHistoryMarkdown" type="button" title="Documento legible">Exportar Markdown</button>
        <button id="importHistory" type="button">Importar JSON</button>
        <input id="importHistoryInput" type="file" accept="application/json,.json" hidden />
      </div>
      <button id="closeDrawer" class="drawer-close" type="button" aria-label="Cerrar historial">✕</button>
    </div>
    <button id="newChat" class="new-chat-button" type="button">＋ Nuevo chat</button>
    <label class="history-search">
      <span aria-hidden="true">⌕</span>
      <input id="historySearch" type="search" placeholder="Buscar en todo el historial…" autocomplete="off" />
    </label>
    <div id="historySearchStatus" class="history-search-status" aria-live="polite"></div>
    <div id="historyTransferStatus" class="history-transfer-status" aria-live="polite"></div>
    <div id="conversationList" class="conversation-list"></div>
  </aside>
  <main>
    <header class="app-header">
      <div class="header-left">
        <button id="menuButton" class="menu-button" type="button" aria-label="Abrir historial">☰</button>
        <h1><span id="appIconState" class="app-icon-wrap" title="IA lista"><img class="app-icon" src="ai-icon.svg" alt="" /><span class="app-icon-spinner" aria-hidden="true"></span></span>Mini chat local</h1>
      </div>
      <div class="header-actions">
        <button id="deleteActive" class="delete-active" type="button" title="Eliminar esta conversación" aria-label="Eliminar esta conversación" disabled>🗑</button>
        <div class="status"><span id="dot" class="dot"></span><span id="status">Conectando con Ollama…</span></div>
      </div>
    </header>

    <section class="settings">
      <label>
        Dirección de Ollama
        <input id="baseUrl" value="http://localhost:11434" spellcheck="false" />
      </label>
      <label>
        Modelo
        <select id="model" aria-label="Modelo de Ollama"></select>
        <span id="modelHint" class="model-hint"></span>
      </label>
      <label class="web-option">
        <input id="useWeb" type="checkbox" />
        <span id="webLabel">Internet apagado</span>
      </label>
    </section>

    <section class="chat">
      <div id="messages" class="messages">
        <div id="welcome" class="welcome">Empezá una conversación.</div>
      </div>
      <div class="attachment">
        <label class="attach-label" for="imageInput">📎 Adjuntar archivo</label>
        <input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif,application/pdf,.pdf" />
        <span id="attachedName" class="attached-name"></span>
      </div>
      <textarea id="prompt" placeholder="Escribí tu mensaje…" autofocus></textarea>
      <div class="actions">
        <span class="hint">Enter para enviar · Shift + Enter para nueva línea</span>
        <button id="send" type="button">Enviar</button>
      </div>
    </section>

    <div id="errorBox" class="error-box"></div>
  </main>
  <div id="completionToast" class="completion-toast" role="status" aria-live="polite">✓ La respuesta está lista.</div>

  <script>
    const baseUrlInput = document.querySelector('#baseUrl');
    const modelInput = document.querySelector('#model');
    const modelHint = document.querySelector('#modelHint');
    const useWebInput = document.querySelector('#useWeb');
    const webLabel = document.querySelector('#webLabel');
    const promptInput = document.querySelector('#prompt');
    const messagesBox = document.querySelector('#messages');
    const imageInput = document.querySelector('#imageInput');
    const attachedName = document.querySelector('#attachedName');
    const sendButton = document.querySelector('#send');
    const statusText = document.querySelector('#status');
    const dot = document.querySelector('#dot');
    const errorBox = document.querySelector('#errorBox');
    const completionToast = document.querySelector('#completionToast');
    const menuButton = document.querySelector('#menuButton');
    const historyDrawer = document.querySelector('#historyDrawer');
    const drawerOverlay = document.querySelector('#drawerOverlay');
    const closeDrawerButton = document.querySelector('#closeDrawer');
    const newChatButton = document.querySelector('#newChat');
    const historySearchInput = document.querySelector('#historySearch');
    const historySearchStatus = document.querySelector('#historySearchStatus');
    const historySettingsButton = document.querySelector('#historySettingsButton');
    const historyTools = document.querySelector('#historyTools');
    const exportHistoryJsonButton = document.querySelector('#exportHistoryJson');
    const exportHistoryMarkdownButton = document.querySelector('#exportHistoryMarkdown');
    const importHistoryButton = document.querySelector('#importHistory');
    const importHistoryInput = document.querySelector('#importHistoryInput');
    const historyTransferStatus = document.querySelector('#historyTransferStatus');
    const conversationList = document.querySelector('#conversationList');
    const deleteActiveButton = document.querySelector('#deleteActive');
    const appIconState = document.querySelector('#appIconState');
    const appFavicon = document.querySelector('#appFavicon');
    let controller = null;
    let history = [];
    let conversations = [];
    let activeConversationId = null;
    let completionToastTimer = null;
    let pendingHistoryJump = null;

    const LEGACY_HISTORY_STORAGE_KEY = 'mini_chat_local_history_v1';
    const LEGACY_ACTIVE_CHAT_KEY = 'mini_chat_local_active_v1';
    const HISTORY_DB_NAME = 'ia_local_history';
    const HISTORY_DB_VERSION = 1;
    const HISTORY_STORE_NAME = 'app_state';
    const HISTORY_STATE_KEY = 'chat_history';
    const MAX_CONTEXT_MESSAGES = 12;
    const MAX_CONTEXT_CHARS = 12000;
    const MAX_CONTEXT_MESSAGE_CHARS = 2500;
    const RECENT_CONTEXT_MESSAGES = 4;
    const CONTEXT_STOP_WORDS = new Set([
      'como', 'con', 'del', 'desde', 'donde', 'este', 'esta', 'estos', 'estas', 'eso', 'esa',
      'para', 'pero', 'por', 'porque', 'que', 'una', 'uno', 'unos', 'unas', 'the', 'and', 'for',
      'from', 'this', 'that', 'with', 'you', 'your', 'los', 'las', 'sus', 'más', 'mas', 'muy'
    ]);
    const REVERSE_SEARCH_ENGINE_NAMES = [
      'Google Lens', 'Yandex Images', 'TinEye', 'Ascii2D'
    ];
    const DEFAULT_DOCUMENT_TITLE = document.title;
    const LOADING_FAVICON = `data:image/svg+xml,${encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
        <rect width="64" height="64" rx="16" fill="#111318"/>
        <circle cx="32" cy="32" r="21" fill="none" stroke="#312b65" stroke-width="7"/>
        <circle cx="32" cy="32" r="21" fill="none" stroke="#8b7df0" stroke-width="7" stroke-linecap="round" stroke-dasharray="76 56">
          <animateTransform attributeName="transform" type="rotate" from="0 32 32" to="360 32 32" dur=".75s" repeatCount="indefinite"/>
        </circle>
        <path d="M32 18v20m0 0-8-8m8 8 8-8M22 45h20" fill="none" stroke="#82f7bd" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    `)}`;

    const baseUrl = () => baseUrlInput.value.trim().replace(/\/$/, '');
    const usingNodeBridge = location.protocol.startsWith('http') && location.port === '8765';

    function setStatus(text, state = '') {
      statusText.textContent = text;
      dot.className = `dot ${state}`;
    }

    function showError(message) {

      setStatus('Sin conexión', 'error');
    }

    function setThinkingState(thinking) {

      appIconState.title = thinking ? 'La IA está pensando…' : 'IA lista';
      appIconState.setAttribute('aria-label', appIconState.title);
      appFavicon.href = thinking ? LOADING_FAVICON : 'ai-icon.svg';
      document.title = thinking ? '⏳ Pensando… · IA Local' : DEFAULT_DOCUMENT_TITLE;
      try {

    async function requestNotificationPermission() {
      if (!('Notification' in window) || Notification.permission !== 'default') return;
      try { await Notification.requestPermission(); }
      catch {}
    }

    function showCompletionToast() {
      clearTimeout(completionToastTimer);
      completionToast.classList.add('show');
      completionToastTimer = setTimeout(() => completionToast.classList.remove('show'), 4500);
    }

    async function notifyAnswerReady() {
      showCompletionToast();
      if (usingNodeBridge) {
        try {
          const response = await fetch('/api/notify', { method: 'POST' });
          if (response.ok) return;
        } catch {}
      }
      if (!('Notification' in window) || Notification.permission !== 'granted') return;
      const notification = new Notification('IA Local', {
        body: 'La respuesta está lista.',
        icon: new URL('ai-icon.svg', location.href).href,
        tag: 'ia-local-answer-ready'
      });
      notification.onclick = () => {
        window.focus();
        notification.close();
      };
